<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Таблица лидеров</title>
    <style>
        body { font-family: sans-serif; background: #282c34; color: #eee; padding: 40px; }
        h1 { text-align: center; }
        table { margin: 20px auto; border-collapse: collapse; min-width: 420px; }
        th, td { padding: 10px 18px; border-bottom: 1px solid #444; text-align: center; }
        th { color: gold; }
        tr:nth-child(even) { background: #313640; }
        a { color: gold; }
        .nav { text-align: center; }
    </style>
</head>
<body>
    <h1>🏆 Таблица лидеров</h1>
    <table>
        <tr>
            <th>Имя</th>
            <th>Длительность игры</th>
            <th>Счёт</th>
        </tr>
        {% for row in rows %}
        <tr>
            <td>{{ row.name }}</td>
            <td>{{ row.duration }}</td>
            <td>{{ row.score }}</td>
        </tr>
        {% endfor %}
    </table>
    <p class="nav"><a href="/">Об опыте в ИИ</a></p>
</body>
</html>
